name: Build Phantom-Code V2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: |
          chmod +x gradlew
          mkdir -p app/src/main/jniLibs/arm64-v8a
          curl --fail --location --retry 3 \
            "https://github.com/VSFLima/phantom-releases/releases/download/distro-phantom/phantom.tar.gz" \
            | tar -xzO qemu-system-aarch64 > app/src/main/jniLibs/arm64-v8a/libphantom_qemu.so
          chmod 0755 app/src/main/jniLibs/arm64-v8a/libphantom_qemu.so
          ./gradlew :app:assembleDebug --no-daemon
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: phantom-code-v2-debug-${{ github.run_number }}
          path: ${{ github.workspace }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish manual APK release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v2-debug-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            app/build/outputs/apk/debug/app-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Phantom-Code V2 debug ${GITHUB_RUN_NUMBER}" \
            --notes "Build manual da V2." \
            --prerelease
