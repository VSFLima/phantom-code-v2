name: Build Phantom-Code V2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build signed release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon
          test -f app/build/outputs/apk/release/app-release.apk
          ls -lh app/build/outputs/apk/release/app-release.apk

      - name: Verify APK signature
        run: |
          if [ -d "$ANDROID_SDK_ROOT/build-tools" ]; then
            APKSIGNER=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          elif [ -d "$ANDROID_HOME/build-tools" ]; then
            APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          else
            APKSIGNER=$(find "$HOME" -name apksigner 2>/dev/null | sort -V | tail -1)
          fi
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk
          echo "APK assinado com chave privada."

      - name: Upload APK
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: phantom-code-v2-release-${{ github.run_number }}
          path: ${{ github.workspace }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish manual APK release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v2-release-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            app/build/outputs/apk/release/app-release.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Phantom-Code V2 release ${GITHUB_RUN_NUMBER}" \
            --notes "Build assinado com chave privada." \
            --prerelease
